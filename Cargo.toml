[workspace]
resolver = "3"
# Add "bin/*" when daedalusd arrives in Phase 5. Cargo reads a glob that
# matches nothing as a literal path and refuses to load the workspace.
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/NullNUMMER24/daedalus"
# Not on crates.io. Also tells cargo-deny these are private crates, so the
# licence check applies to dependencies only until a licence is chosen.
publish = false

# Every dependency version is declared once, here; member crates write
# `foo = { workspace = true }`. Twelve crates drifting apart on serde versions
# is a problem that arrives surprisingly early.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ipnet = "2"
miette = { version = "7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
strsim = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

# Test-only
insta = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Handle errors from day one. Tests are exempted in clippy.toml.
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
