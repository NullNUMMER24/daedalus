apiVersion: daedalus.io/v1alpha1
kind: Machine
metadata:
  name: db-01
  labels:
    role: database
  annotations:
    daedalus.io/protected: "true"
spec:
  provider: pve-main
  image: debian-12
  class: standard-4x8
  # Overrides the class's 8Gi.
  memory: 32Gi
  disks:
    # Replaces the class's `root`, keeping the name…
    - name: root
      size: 60Gi
      discard: true
    # …and adds a disk the class does not have.
    - name: data
      size: 500Gi
      storage: tenant-acme-ssd
  networks:
    - ref: prod-net
      address: 10.20.10.20
    - ref: mgmt-net
      address: 10.20.99.20
