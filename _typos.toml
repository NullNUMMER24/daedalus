# docs/gitops.md and docs/plan/phase-1-core-model.md deliberately misspell
# `memory` as `memroy` to show what Daedalus's YAML error output looks like
# ("did you mean `memory`?"). Allow that one word so `typos` stays useful for
# catching real mistakes.
[default.extend-words]
memroy = "memroy"
# Misspellings the tests feed the validator on purpose, to check that it
# suggests the right word: `sise` -> `size`, `pve-mian` -> `pve-main`,
# `Netwrok` -> `Network`.
sise = "sise"
mian = "mian"
Netwrok = "Netwrok"
